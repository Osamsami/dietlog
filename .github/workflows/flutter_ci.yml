name: Flutter Production CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Project Dependencies
      run: flutter pub get

    - name: Run Build Runner (Generate Missing Type-Safe Files)
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Verify Code Formatting
      run: dart format --output=none --set-exit-if-changed lib/

    - name: Static Code Analysis (Linter check)
      run: flutter analyze

    - name: Run Operational Unit Tests
      run: flutter test
