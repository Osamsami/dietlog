name: Flutter Production CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Project Dependencies
      run: flutter pub get

    - name: Inject Mock Environment File for Assets Check
      run: |
        echo "SUPABASE_URL=https://mock.supabase.co" > .env
        echo "SUPABASE_ANON_KEY=mock_key" >> .env

    - name: Verify Human Code Formatting
      run: dart format --output=none --set-exit-if-changed lib/

    - name: Run Build Runner (Generate Machine Code)
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Static Code Analysis (Ignore Non-Breaking Warnings)
      run: flutter analyze --no-fatal-warnings

    - name: Run Operational Unit Tests
      run: flutter test
