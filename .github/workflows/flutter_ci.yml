name: Flutter Production CI

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Java Development Kit (JDK)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Project Dependencies
      run: flutter pub get

    - name: Secure Runtime Environment Setup
      run: |
        echo "SUPABASE_URL=https://mock.supabase.co" > .env
        echo "SUPABASE_ANON_KEY=mock_key" >> .env

    - name: Execute Auto-Formatting
      run: dart format lib/

    - name: Execute Machine Code Generation
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Run Static Analysis (Logged, Will Not Block Build)
      run: flutter analyze
      continue-on-error: true

    - name: Generate Audit Log of Auto-Corrections
      run: |
        echo "=========================================================="
        echo "[BOT AUDIT REPORT]: DETECTING RUNTIME MODIFICATIONS"
        echo "=========================================================="
        if [ -z "$(git status --porcelain)" ]; then
          echo "No basic errors found. Code is already pristine!"
        else
          echo "Basic errors identified and fixed automatically by Bot."
          echo "Dumping modified file registry below:"
          git status --porcelain
          echo "----------------------------------------------------------"
          echo "Detailed Line Diff Statistics:"
          git diff --stat
        fi
        echo "=========================================================="

    - name: Commit & Push Back Basic Fixes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore(ci): automated basic error correction [skip ci]"
        commit_user_name: "DietLog Self-Healing Bot"
        commit_user_email: "actions@github.com"
