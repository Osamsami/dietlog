name: diet_log
description: "DietLog — Vision-Based Nutrition Tracking & Analytics Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Supabase (Auth + Database + Realtime) ────────────────────────────
  supabase_flutter: ^2.8.0

  # ── Local Storage ────────────────────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── State Management ─────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ── Networking ───────────────────────────────────────────────────────
  dio: ^5.7.0

  # ── Serialization ────────────────────────────────────────────────────
  json_annotation: ^4.9.0

  # ── Environment Configuration ────────────────────────────────────────
  flutter_dotenv: ^5.2.1

  # ── Image Capture ────────────────────────────────────────────────────
  image_picker: ^1.1.2

  # ── Live Camera Preview ──────────────────────────────────────────────
  camera: ^0.11.0+2

  # ── UUID Generation ──────────────────────────────────────────────────
  uuid: ^4.5.1

  # ── Date / Time Formatting ───────────────────────────────────────────
  intl: ^0.19.0

  # ── Shared Preferences (lightweight key-value) ───────────────────────
  shared_preferences: ^2.3.4

  # ── Path Provider ────────────────────────────────────────────────────
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # ── Code Generation ──────────────────────────────────────────────────
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/logo/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/icon.png"